    "APScheduler>=3.10,<4",
    "chromadb>=1.0,<2",
    "cryptography>=42,<51",
    "duckdb>=1.1,<2",
    "edge-tts>=6.1,<8",
    "espeakng-loader>=0.2,<1",
    "face-recognition>=1.3,<2",
    "fastapi>=0.115,<1",
    "faster-whisper>=1.0,<2",
    "gTTS>=2.5,<3",
    "huggingface-hub>=0.25,<2",
    "keyboard>=0.13.5,<1",
    "kokoro-onnx>=0.4,<1",
    "llama-cpp-python>=0.3,<0.4",
    "loguru>=0.7,<1",
    "mcp>=1.9,<3",
    "moondream>=1.3,<3",
    "mss>=9,<11",
    "numpy>=1.26.4,<2.5",
    "ollama>=0.4,<1",
    "opencv-contrib-python>=4.10,<6",
    "openwakeword>=0.6,<1",
    "packaging>=23,<27",
    "pdfplumber>=0.11,<1",
    "Pillow>=10.3,<13",
    "piper-tts>=1.4,<2",
    "playwright>=1.45,<2",
    "playwright-stealth>=1.0.6,<3",
    "playsound==1.2.2",
    "psutil>=5.9,<8",
    "PyAudio>=0.2.14,<1",
    "pydantic>=2.7,<3",
    "pydub>=0.25,<1",
    "PyGetWindow>=0.0.9,<1",
    "pyautogui>=0.9.54,<1",
    "pyperclip>=1.9,<2",
    "pynput>=1.7.7,<2",
    "pytesseract>=0.3.10,<1",
    "python-multipart>=0.0.9,<1",
    "python-telegram-bot>=21,<23",
    "pyttsx3>=2.90,<3",
    "pywebpush>=2.0,<3",
    "pywhatkit>=5.4,<6",
    "PyQt5>=5.15.10,<6",
