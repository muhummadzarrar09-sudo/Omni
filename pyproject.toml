    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<8",
    "python-multipart>=0.0.9,<1",
    "qrcode>=7.4,<9",
    "requests>=2.31,<3",
    "ruff>=0.8,<1",
    "schedule>=1.2,<2",
