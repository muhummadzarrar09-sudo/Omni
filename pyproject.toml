[build-system]
requires = ["setuptools>=83,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-agi"
version = "3.2.0"
description = "Experimental local-first personal AI assistant"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "Muhammad Zarrar" }]
keywords = ["local-ai", "personal-assistant", "multi-agent", "voice", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The base distribution is intentionally dependency-free: it provides package
# metadata and lightweight CLI commands such as `omni --help`, `omni install`,
# and `omni engine info`.
# Install one of the documented profiles for runtime capabilities.
dependencies = []

[project.urls]
Repository = "https://github.com/muhummadzarrar09-sudo/Omni"
Issues = "https://github.com/muhummadzarrar09-sudo/Omni/issues"

[project.scripts]
omni = "omni.cli:main"

[project.optional-dependencies]
# Core orchestration, persistence, scheduling, vault, and FastAPI backend.
core = [
    "APScheduler>=3.10,<4",
    "cryptography>=42,<51",
    "fastapi>=0.115,<1",
    "loguru>=0.7,<1",
    "numpy>=1.26.4,<2.5",
    "packaging>=23,<27",
    "psutil>=5.9,<8",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9,<1",
    "qrcode>=7.4,<9",
    "requests>=2.31,<3",
    "schedule>=1.2,<2",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=13,<18",
]

# Speech-to-text, text-to-speech, microphone, and wake-word implementations.
voice = [
    "edge-tts>=6.1,<8",
    "loguru>=0.7,<1",
    "numpy>=1.26.4,<2.5",
    "espeakng-loader>=0.2,<1",
    "faster-whisper>=1.0,<2",
    "gTTS>=2.5,<3",
    "kokoro-onnx>=0.4,<1",
    "openwakeword>=0.6,<1",
    "piper-tts>=1.4,<2",
    "playsound==1.2.2",
    "PyAudio>=0.2.14,<1",
    "pydub>=0.25,<1",
    "requests>=2.31,<3",
    "pvporcupine>=3,<5",
    "pyttsx3>=2.90,<3",
    "sounddevice>=0.4.6,<1",
    "soundfile>=0.12,<1",
    "SpeechRecognition>=3.10,<4",
    "vosk>=0.3.45,<1",
]

# Screen capture, OCR, local visual models, and face-security implementations.
vision = [
    "face-recognition>=1.3,<2",
    "loguru>=0.7,<1",
    "moondream>=1.3,<3",
    "mss>=9,<11",
    "numpy>=1.26.4,<2.5",
    "ollama>=0.4,<1",
    "opencv-contrib-python>=4.10,<6",
    "pdfplumber>=0.11,<1",
    "Pillow>=10.3,<13",
    "pyautogui>=0.9.54,<1",
    "pytesseract>=0.3.10,<1",
    "transformers>=4.45,<6",
]

# Native desktop UI, input automation, and browser automation.
desktop = [
    "keyboard>=0.13.5,<1",
    "loguru>=0.7,<1",
    "playwright>=1.45,<2",
    "psutil>=5.9,<8",
    "playwright-stealth>=1.0.6,<3",
    "PyGetWindow>=0.0.9,<1",
    "PyQt5>=5.15.10,<6",
    "pyautogui>=0.9.54,<1",
    "pyperclip>=1.9,<2",
    "pynput>=1.7.7,<2",
    "pywin32>=306,<312; platform_system == 'Windows'",
]

# Core runtime plus deterministic build, test, lint, lock, and audit tooling.
dev = [
    "APScheduler>=3.10,<4",
    "build>=1.2,<2",
    "cryptography>=42,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "loguru>=0.7,<1",
    "numpy>=1.26.4,<2.5",
    "packaging>=23,<27",
    "pip-audit>=2.7,<3",
    "pip-licenses>=5,<6",
    "pip-tools>=7.4,<8",
    "psutil>=5.9,<8",
    "pydantic>=2.7,<3",
