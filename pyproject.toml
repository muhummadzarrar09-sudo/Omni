[tool.setuptools.packages.find]
where = ["."]
include = ["omni", "omni.*", "omni_v2", "omni_v2.*", "backend_fastapi", "backend_fastapi.*"]
exclude = ["omni_v2.tests", "omni_v2.tests.*"]
namespaces = false

[tool.setuptools.package-data]
omni_v2 = ["ui/*.html", "web_ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests", "omni_v2/tests"]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
markers = [
    "backend_live: requires a separately running backend or live service boundary",
    "contract: request/response or protocol contract coverage",
    "e2e: end-to-end workflow coverage",
    "hardware: requires physical hardware",
    "integration: crosses a real component boundary",
    "manual: requires explicit human observation",
    "platform: platform-specific qualification coverage",
    "privacy: privacy or egress-control verification",
    "security: security-focused verification",
    "unit: isolated deterministic unit coverage",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["archive", "node_modules"]
